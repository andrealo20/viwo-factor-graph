name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ubuntu / gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libboost-all-dev, not libboost-dev: the latter is headers only.
      # GTSAMConfig.cmake calls find_dependency(Boost), which in config mode
      # looks for boost_serialization and the other compiled components, and
      # fails to configure without them. Building by hand with -lgtsam never
      # went through GTSAM's config, so this only surfaced once the build
      # moved to CMake.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtsam-dev libeigen3-dev libboost-all-dev libtbb-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy for the independent Jacobian check
        run: pip install numpy

      # Built through CMake rather than by hand, because cmake and ctest are
      # what the README tells a reader to run, and a build file that CI never
      # exercises is a build file that quietly stops working.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # The Jacobian tests are the ones that matter: a wrong analytical
      # derivative raises no error, it produces an optimiser that converges to
      # the wrong answer. One checks against GTSAM's own retraction, the other
      # against an independent numpy implementation.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run the benchmark
        working-directory: build
        run: ./viwo_benchmark | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the trajectory figure
        run: |
          pip install matplotlib
          python3 scripts/plot_ate_trajectory.py build/trajectory_results.csv

      - name: Upload the figure and the trajectory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory
          path: |
            docs/ate_trajectory_plot.png
            build/trajectory_results.csv
