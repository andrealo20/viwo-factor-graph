name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ubuntu / gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libboost-all-dev, not libboost-dev: the latter is headers only.
      # GTSAMConfig.cmake calls find_dependency(Boost), which in config mode
      # looks for boost_serialization and the other compiled components, and
      # fails to configure without them. Building by hand with -lgtsam never
      # went through GTSAM's config, so this only surfaced once the build
      # moved to CMake.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtsam-dev libeigen3-dev libboost-all-dev libtbb-dev libmetis-dev

      # Ubuntu's libgtsam-dev ships GTSAM-exports.cmake with an imported
      # CppUnitLite target pointing at libCppUnitLite.a, and does not install
      # that file. find_package(GTSAM) then aborts with a hard error on an
      # otherwise working install. CppUnitLite is GTSAM's own test framework
      # and nothing here links it, so an empty archive satisfies the existence
      # check without changing what gets built.
      - name: Work around the missing CppUnitLite archive
        run: |
          lib=/usr/lib/x86_64-linux-gnu/libCppUnitLite.a
          if [ ! -f "$lib" ]; then
            sudo ar rcs "$lib"
            echo "created an empty $lib"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy for the independent Jacobian check
        run: pip install numpy

      # Built through CMake rather than by hand, because cmake and ctest are
      # what the README tells a reader to run, and a build file that CI never
      # exercises is a build file that quietly stops working.
      # The configure output is copied into the job summary, and on failure
      # the CMake error is also emitted as an annotation. Both are readable on
      # the run page, so a broken configure says what broke rather than only
      # reporting an exit code.
      - name: Configure
        run: |
          set +e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log
          status=${PIPESTATUS[0]}
          echo "### CMake configure" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat configure.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            python3 -c "log=open('configure.log',errors='replace').read();i=log.lower().find('cmake error');s=log[max(0,i-300):i+1500] if i>=0 else log[-1500:];print('::error title=CMake configure failed::'+s.replace(chr(10),'%0A'))"
          fi
          exit "$status"

      # Same treatment as configure: the compiler diagnostics reach the run
      # page rather than only the step log.
      - name: Build
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Build output"
              echo '```'
              tail -c 60000 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            python3 -c "import re;log=open('build.log',errors='replace').read();hits=[m.start() for m in re.finditer(r'error:',log)];s=log[max(0,hits[0]-800):hits[0]+2000] if hits else log[-2000:];print('::error title=Build failed::'+s.replace(chr(10),'%0A'))"
          fi
          exit "$status"

      # The Jacobian tests are the ones that matter: a wrong analytical
      # derivative raises no error, it produces an optimiser that converges to
      # the wrong answer. One checks against GTSAM's own retraction, the other
      # against an independent numpy implementation.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Run the benchmark
        working-directory: build
        run: ./viwo_benchmark | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerate the trajectory figure
        run: |
          pip install matplotlib
          python3 scripts/plot_ate_trajectory.py build/trajectory_results.csv

      - name: Upload the figure and the trajectory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory
          path: |
            docs/ate_trajectory_plot.png
            build/trajectory_results.csv
